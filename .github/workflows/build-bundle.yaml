name: Build Android App Bundle

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 30.0.16248370
  # Pinned so the bindings in the AAR do not change with whatever x/mobile is newest.
  GOMOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e
  BUNDLETOOL_VERSION: 1.18.3
  BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29

jobs:
  build:
    name: Build Release AAB
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Export NDK paths
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: k8s-engine/go.sum

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      - name: Install Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"

      - name: Cache Gomobile tool
        id: cache-gomobile
        uses: actions/cache@v5
        with:
          path: |
            ~/go/bin/gomobile
            ~/go/bin/gobind
          key: gomobile-${{ runner.os }}-${{ env.GOMOBILE_VERSION }}

      - name: Install gomobile
        if: steps.cache-gomobile.outputs.cache-hit != 'true'
        run: |
          go install "golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}"
          gomobile init

      - name: Cache JNI native libraries
        id: cache-jni
        uses: actions/cache@v5
        with:
          path: |
            android/data/libs/kubenexus.aar
            android/data/libs/kubenexus-sources.jar
            android/app/src/main/jniLibs
            terminal-native/.zig-cache
          key: jni-${{ runner.os }}-${{ hashFiles('k8s-engine/**', 'terminal-native/**') }}
          restore-keys: |
            jni-${{ runner.os }}-

      - name: Build JNI native libraries
        run: make jni

      # The jniLibs cache is keyed on source hashes only, so a cache restored from a partial
      # build can leave an ABI missing while make still considers the set satisfied. This is the
      # last point where that is still cheap to catch.
      - name: Verify native libraries for all ABIs
        run: make verify-jni

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradlew executable
        run: chmod +x ./android/gradlew

      - name: Set up bundletool
        run: |
          curl -sSL --retry 3 -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"

      # Release builds are signed with the upload key and nothing else: Google Play rejects
      # debug-signed uploads, and Gradle now refuses to package a release without the key.
      - name: Decode upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::The UPLOAD_KEYSTORE_BASE64 secret is not set. Release builds must be signed with the upload key."
            exit 1
          fi
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: make build

      # An AAB cannot be side-loaded, so also emit installable APKs from it. They are
      # signed with the same upload key as the AAB, so they install and update over each
      # other. Play-installed copies carry the Play app signing key instead, so a sideloaded
      # build and a Play build of the app cannot update one another.
      - name: Generate installable APKs from the AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          DIST="dist"

          rm -rf "$DIST" && mkdir -p "$DIST"

          # Passwords go through files so they never appear on a command line.
          umask 077
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks-pass"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/key-pass"

          SIGN_ARGS=(
            --ks="$KEYSTORE_PATH"
            --ks-key-alias="$KEY_ALIAS"
            --ks-pass="file:$RUNNER_TEMP/ks-pass"
            --key-pass="file:$RUNNER_TEMP/key-pass"
          )

          # bundletool only warns when output is unsigned; treat that as fatal
          # so an un-signable keystore fails the build instead of shipping
          # APKs that cannot be installed.
          build_apks() {
            local log
            if ! log=$(java -jar "$BUNDLETOOL_JAR" build-apks "$@" 2>&1); then
              echo "$log"
              return 1
            fi
            if grep -q "won't be signed" <<<"$log"; then
              echo "$log"
              echo "::error::bundletool produced unsigned APKs"
              return 1
            fi
          }

          # One universal APK, installable on any supported device.
          build_apks \
            --bundle="$AAB" \
            --output="$RUNNER_TEMP/universal.apks" \
            --mode=universal \
            --overwrite \
            "${SIGN_ARGS[@]}"
          unzip -o -q "$RUNNER_TEMP/universal.apks" -d "$RUNNER_TEMP/universal"
          cp "$RUNNER_TEMP/universal/universal.apk" "$DIST/kubenexus-universal.apk"

          # Per-ABI sets, each a master split plus that ABI's native split.
          # bundletool has no per-ABI standalone mode, so zip each pair.
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            spec="$RUNNER_TEMP/spec-$abi.json"
            printf '{"supportedAbis":["%s"],"screenDensity":480,"sdkVersion":35,"supportedLocales":["en"]}\n' \
              "$abi" > "$spec"

            build_apks \
              --bundle="$AAB" \
              --output="$RUNNER_TEMP/$abi.apks" \
              --device-spec="$spec" \
              --optimize-for=abi \
              --overwrite \
              "${SIGN_ARGS[@]}"

            unzip -o -q "$RUNNER_TEMP/$abi.apks" -d "$RUNNER_TEMP/$abi"
            (cd "$RUNNER_TEMP/$abi/splits" && zip -q -r "$GITHUB_WORKSPACE/$DIST/kubenexus-$abi-apks.zip" .)
          done

          ls -la "$DIST"

      - name: Upload Release AAB
        id: upload-release-aab
        uses: actions/upload-artifact@v7
        with:
          name: kubenexus-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 1
          if-no-files-found: error

      - name: Upload Universal APK
        uses: actions/upload-artifact@v7
        with:
          name: kubenexus-universal-apk
          path: dist/kubenexus-universal.apk
          retention-days: 1
          if-no-files-found: error

      - name: Upload per-ABI APKs
        uses: actions/upload-artifact@v7
        with:
          name: kubenexus-per-abi-apks
          path: dist/kubenexus-*-apks.zip
          retention-days: 1
          if-no-files-found: error

      - name: Get Artifact URLs
        id: get-artifact-urls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"

          ARTIFACTS_JSON=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts")
          BASE_URL="${{ github.server_url }}/${REPO}/actions/runs/${RUN_ID}/artifacts"

          for name in kubenexus-release-aab kubenexus-universal-apk kubenexus-per-abi-apks; do
            id=$(echo "$ARTIFACTS_JSON" | jq -r --arg n "$name" '.artifacts[] | select(.name==$n) | .id' | head -1)
            if [ -z "$id" ] || [ "$id" = "null" ]; then
              echo "::warning::Artifact $name not found in run $RUN_ID"
              continue
            fi
            echo "${name}_url=${BASE_URL}/${id}" >> "$GITHUB_OUTPUT"
          done

      - name: Send Artifact Links to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          AAB_URL: ${{ steps.get-artifact-urls.outputs.kubenexus-release-aab_url }}
          UNIVERSAL_URL: ${{ steps.get-artifact-urls.outputs.kubenexus-universal-apk_url }}
          PER_ABI_URL: ${{ steps.get-artifact-urls.outputs.kubenexus-per-abi-apks_url }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set. Skipping Telegram notification."
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          COMMIT_MSG_ESCAPED=$(echo "$COMMIT_MSG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          COMMIT_SHA=$(git rev-parse --short HEAD)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TEXT="<b>KubeNexus Build Completed</b>"$'\n\n'
          TEXT+="<b>Artifacts:</b>"$'\n'
          TEXT+="- <a href=\"${UNIVERSAL_URL:-$RUN_URL}\">kubenexus-universal-apk</a> <i>(install on any device)</i>"$'\n'
          TEXT+="- <a href=\"${PER_ABI_URL:-$RUN_URL}\">kubenexus-per-abi-apks</a> <i>(arm64-v8a / armeabi-v7a / x86_64 / x86)</i>"$'\n'
          TEXT+="- <a href=\"${AAB_URL:-$RUN_URL}\">kubenexus-release-aab</a> <i>(for Play)</i>"$'\n\n'
          TEXT+="<b>Build Details:</b>"$'\n'
          TEXT+="- <b>Branch:</b> <code>${{ github.ref_name }}</code>"$'\n'
          TEXT+="- <b>Commit:</b> <code>${COMMIT_SHA}</code> - ${COMMIT_MSG_ESCAPED}"$'\n'
          TEXT+="- <b>Workflow Run:</b> <a href=\"${RUN_URL}\">#${{ github.run_number }}</a>"

          echo "Sending artifact links to Telegram..."

          CURL_MSG_ARGS=(
            -s -S -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
            --retry 3
            -F "chat_id=${TELEGRAM_CHAT_ID}"
            --form-string "text=${TEXT}"
            -F "parse_mode=HTML"
            -F "disable_web_page_preview=true"
          )
          if [ -n "$TELEGRAM_TOPIC_ID" ]; then
            CURL_MSG_ARGS+=(-F "message_thread_id=${TELEGRAM_TOPIC_ID}")
          fi

          RESPONSE=$(curl "${CURL_MSG_ARGS[@]}")
          echo "Telegram response: $RESPONSE"
